  uv.lock:              {filename: {foreground: "#585b70"}, icon: {style: {foreground: "#585b70"}}}
  # Docker
  Dockerfile:           {filename: {foreground: "#cdd6f4"}, icon: {style: {foreground: "#2496ed"}}}
  docker-compose.yml:   {filename: {foreground: "#cdd6f4"}, icon: {style: {foreground: "#2496ed"}}}
  docker-compose.yaml:  {filename: {foreground: "#cdd6f4"}, icon: {style: {foreground: "#2496ed"}}}
  # Git
  .gitignore:           {filename: {foreground: "#7f849c"}, icon: {style: {foreground: "#7f849c"}}}
  .gitconfig:           {filename: {foreground: "#7f849c"}, icon: {style: {foreground: "#f38ba8"}}}
