  .profile:             {filename: {foreground: "#7f849c"}, icon: {style: {foreground: "#6c7086"}}}
  .env:                 {filename: {foreground: "#7f849c"}, icon: {style: {foreground: "#a6e3a1"}}}
  .env.local:           {filename: {foreground: "#585b70"}, icon: {style: {foreground: "#585b70"}}}
  .env.example:         {filename: {foreground: "#7f849c"}, icon: {style: {foreground: "#7f849c"}}}
  .vimrc:               {filename: {foreground: "#7f849c"}, icon: {style: {foreground: "#57ab5a"}}}
  .npmrc:               {filename: {foreground: "#7f849c"}, icon: {style: {foreground: "#cc3534"}}}
  .editorconfig:        {filename: {foreground: "#7f849c"}, icon: {style: {foreground: "#7f849c"}}}
  .prettierrc:          {filename: {foreground: "#7f849c"}, icon: {style: {foreground: "#f7ba3e"}}}
  .eslintrc:            {filename: {foreground: "#7f849c"}, icon: {style: {foreground: "#4b32c3"}}}
