  # Docs
  README.md:            {filename: {foreground: "#cdd6f4"}, icon: {style: {foreground: "#b388ff"}}}
  README:               {filename: {foreground: "#cdd6f4"}, icon: {style: {foreground: "#b388ff"}}}
  LICENSE:              {filename: {foreground: "#cdd6f4"}, icon: {style: {foreground: "#9399b2"}}}
  CHANGELOG.md:         {filename: {foreground: "#cdd6f4"}, icon: {style: {foreground: "#9399b2"}}}
  # CI/CD
  .gitlab-ci.yml:       {filename: {foreground: "#cdd6f4"}, icon: {style: {foreground: "#fc6d26"}}}
  # Dotfiles — приглушені назви
  .zshrc:               {filename: {foreground: "#7f849c"}, icon: {style: {foreground: "#4caf50"}}}
  .zsh_history:         {filename: {foreground: "#7f849c"}, icon: {style: {foreground: "#4caf50"}}}
