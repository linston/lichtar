  # JS/TS
  package.json:         {filename: {foreground: "#cdd6f4"}, icon: {style: {foreground: "#ffd000"}}}
  package-lock.json:    {filename: {foreground: "#585b70"}, icon: {style: {foreground: "#585b70"}}}
  yarn.lock:            {filename: {foreground: "#585b70"}, icon: {style: {foreground: "#585b70"}}}
  pnpm-lock.yaml:       {filename: {foreground: "#585b70"}, icon: {style: {foreground: "#585b70"}}}
  bun.lockb:            {filename: {foreground: "#585b70"}, icon: {style: {foreground: "#585b70"}}}
  tsconfig.json:        {filename: {foreground: "#cdd6f4"}, icon: {style: {foreground: "#3b82f6"}}}
  # Python
  pyproject.toml:       {filename: {foreground: "#cdd6f4"}, icon: {style: {foreground: "#ffe066"}}}
